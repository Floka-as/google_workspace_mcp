apiVersion: apps/v1
kind: Deployment
metadata:
  name: gws-mcp
  namespace: mcphub
  labels:
    app: gws-mcp
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the attachment spool is an emptyDir, so two
  # pods would each serve a different half of the /attachments URLs already
  # handed out. Nothing else here is stateful — replicas could go up once
  # attachments move to shared storage.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gws-mcp
  template:
    metadata:
      labels:
        app: gws-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # emptyDir volumes mount root-owned 0755 without this; the process
        # writes credentials, the attachment spool and its log under /data.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gws-mcp
        image: gws-mcp:latest
        # The upstream image's CMD shells out to `uv run main.py`, which wants a
        # writable /app to re-sync the environment. Calling the venv's python
        # directly skips that, which is what lets readOnlyRootFilesystem stand.
        command: ["/app/.venv/bin/python", "main.py", "--transport", "streamable-http"]
        ports:
        - containerPort: 8000
          name: http
        env:
        # Resource server only. Solvei owns the Google authorization-code flow
        # (its own registered redirect URI, its own MCPServerConnection rows)
        # and sends the resulting ya29.* access token here as a bearer. This
        # server issues no tokens: /authorize, /token, /register and
        # /oauth2callback do not exist, and nothing needs registering against
        # gws.mcphub.no in the GCP console.
        #
        # ensure_session_from_access_token builds Credentials(token=<bearer>,
        # refresh_token=None) and skips session storage in this mode, so the pod
        # holds no user credentials at all — fiken-mcp's passthrough, exactly.
        #
        # Caveat worth knowing: validation is a userinfo call, which proves the
        # token is live and whose it is but NOT that it was minted for our
        # client. Any valid Google access token is accepted, acting on its own
        # holder's data within its own scopes.
        - name: MCP_ENABLE_OAUTH21
          value: "true"
        - name: EXTERNAL_OAUTH21_PROVIDER
          value: "true"
        - name: WORKSPACE_MCP_HOST
          value: "0.0.0.0"
        - name: WORKSPACE_MCP_PORT
          value: "8000"
        # Behind the nginx ingress: this is the resource identifier advertised in
        # /.well-known/oauth-protected-resource, and the base for the
        # /attachments URLs the gmail and drive tools hand back.
        - name: WORKSPACE_EXTERNAL_URL
          value: "https://gws.mcphub.no"
        - name: WORKSPACE_MCP_BASE_URI
          value: "https://gws.mcphub.no"
        - name: OAUTHLIB_INSECURE_TRANSPORT
          value: "0"
        # Only Calendar, Gmail and Drive are exposed. Widening this also widens
        # the OAuth scopes requested at consent, so re-consent is required.
        - name: WORKSPACE_MCP_TOOLS
          value: "calendar,gmail,drive"
        # Everything the process writes goes to the ephemeral /data volume:
        # per-user credentials, attachment spool, and any HOME-relative cache.
        - name: WORKSPACE_MCP_CREDENTIALS_DIR
          value: /data/credentials
        - name: WORKSPACE_ATTACHMENT_DIR
          value: /data/attachments
        - name: HOME
          value: /data
        - name: XDG_CACHE_HOME
          value: /tmp
        - name: GOOGLE_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-credentials-google
              key: client_id
        - name: GOOGLE_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-credentials-google
              key: client_secret
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      # emptyDir is enough: in external-provider mode no credentials are
      # persisted, so /data only ever holds the attachment spool and the log.
      # A restart costs nothing but unresolved attachment links.
      - name: data
        emptyDir:
          sizeLimit: 512Mi
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
