apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gws-mcp
  namespace: mcphub
  labels:
    app: gws-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ingress-nginx -> Traefik migration (Floka-as/infra docs/traefik-migration.md):
    # DNS points at Traefik. Remove to roll back to ingress-nginx (TTL 300s).
    external-dns.alpha.kubernetes.io/target: "34.88.148.166"
    # The MCP endpoint streams SSE; the default 60s proxy read timeout would cut
    # long tool calls short.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - gws.mcphub.no
    secretName: gws-mcphub-no-tls
  rules:
  - host: gws.mcphub.no
    http:
      paths:
      # Only these four prefixes, fiken-mcp style. In EXTERNAL_OAUTH21_PROVIDER
      # mode the server issues no tokens, so /authorize, /token, /register and
      # /oauth2callback do not exist to route (they 404).
      #
      #   /mcp          the endpoint. 401 without a bearer token.
      #   /.well-known  protected-resource metadata, pointing clients at Google.
      #   /attachments  uuid4 capability URLs that the gmail and drive tools
      #                 hand back to callers; unroutable means dead links.
      #   /health       probes are in-cluster, but `make smoke` uses this.
      #
      # Deliberately not routed: `/`, which serves the version JSON.
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: gws-mcp
            port:
              number: 8000
      # ImplementationSpecific, not Prefix: the API server warns that a
      # dot-leading segment cannot be used with Prefix. nginx matches this as a
      # prefix either way.
      - path: /.well-known
        pathType: ImplementationSpecific
        backend:
          service:
            name: gws-mcp
            port:
              number: 8000
      - path: /attachments
        pathType: Prefix
        backend:
          service:
            name: gws-mcp
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: gws-mcp
            port:
              number: 8000
