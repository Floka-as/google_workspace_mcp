# Syncs the shared Google OAuth client from the 1Password Security vault into a
# Secret named `oauth2-credentials-google` in the mcphub namespace. It is the
# same item hosting-solvei-dev uses, so its field labels are already:
#
#   client_id
#   client_secret
#
# These are OAuth *client* credentials, not user credentials — end users each
# run their own consent flow against https://gws.mcphub.no. Rotating the item in
# 1Password re-syncs the Secret; the values are read via secretKeyRef at
# container start, so `make rollout` afterwards.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oauth2-credentials-google
  namespace: mcphub
  labels:
    app: gws-mcp
spec:
  itemPath: "vaults/Security/items/solvr-multitenant-oauth2-dev"
