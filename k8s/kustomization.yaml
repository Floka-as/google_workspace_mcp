apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcphub

resources:
  - onepassworditem.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# `make ship` bumps newTag to the pushed commit; ArgoCD syncs from main.
images:
  - name: gws-mcp:latest
    newName: europe-north1-docker.pkg.dev/solvr-multitenant/internal-artifacts/gws-mcp
    newTag: "latest"
